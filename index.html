<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>実務で使いこなすClaude講座｜教材ダッシュボード</title>
  <meta name="description" content="実務で使いこなすClaude講座（全7回）オンライン教材ダッシュボード">
  <meta name="theme-color" content="#2b221c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23d97757'/%3E%3Ctext x='50' y='72' font-size='64' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <div class="brand-mark">C</div>
          <div class="brand-text">
            <div class="brand-title">Claude講座</div>
            <div class="brand-sub">実務で使いこなす（全7回）</div>
          </div>
        </div>
        <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="メニューを閉じる">✕</button>
      </div>

      <div class="progress-block">
        <div class="progress-row">
          <span class="progress-label">学習の進捗</span>
          <span class="progress-value"><span id="progressCount">0</span>/<span id="progressTotal">0</span></span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>

      <div class="sidebar-search">
        <input type="search" id="searchInput" placeholder="レッスンを検索…" autocomplete="off">
      </div>

      <nav class="nav" id="nav" aria-label="レッスン一覧"></nav>
    </aside>

    <div class="sidebar-scrim" id="scrim"></div>

    <!-- Main -->
    <div class="main-wrap">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="メニューを開く">☰</button>
        <div class="topbar-title" id="topbarTitle">ホーム</div>
        <button class="icon-btn instructor-btn" id="instructorBtn" aria-label="講師メモの表示切替" hidden>🔑</button>
        <button class="icon-btn theme-btn" id="themeBtn" aria-label="表示テーマ切替">◐</button>
      </header>

      <main class="content" id="content" tabindex="-1"></main>

      <nav class="lesson-nav" id="lessonNav" hidden>
        <button class="lesson-nav-btn" id="prevBtn">‹ 前のレッスン</button>
        <button class="lesson-nav-btn done-btn" id="doneBtn">完了にする</button>
        <button class="lesson-nav-btn" id="nextBtn">次のレッスン ›</button>
      </nav>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
